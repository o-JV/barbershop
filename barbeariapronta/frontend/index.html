<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1a24">
<title>Barbearia | Agendamento</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230e1a24'/%3E%3Cpath d='M30 12h40v76H30z' fill='%23f6f8f9'/%3E%3Cpath d='M30 20l40 24v16L30 36zM30 52l40 24v12L30 64z' fill='%23d8392b'/%3E%3Cpath d='M30 36l40 24v-16L30 28z' fill='%231d4f91'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="hero">
    <div class="hero-txt">
      <div class="brand">Barbearia</div>
      <h1>Vamo Falar Sobre "Barbearia"</h1>
      <p>Agende seu horário e deixe a comanda pronta antes de chegar.</p>
    </div>
    <div class="poste" aria-hidden="true">
      <i class="cap"></i><i class="tubo"></i><i class="cap"></i>
    </div>
  </div>
  <div class="faixa" aria-hidden="true"></div>
</header>

<noscript><p class="sem-js">Ative o JavaScript para agendar seu horário.</p></noscript>

<main id="app">
  <div class="col">
    <section class="card">
      <h2><span class="n">1</span>Barbeiro</h2>
      <div id="barbeiros" class="opts"></div>
    </section>

    <section class="card">
      <h2><span class="n">2</span>Data e horário</h2>
      <div id="dias" class="opts"></div>
      <p id="livres" class="livres" aria-live="polite"></p>
      <div id="horarios" class="slots"></div>
    </section>

    <section class="card">
      <h2><span class="n">3</span>Serviços</h2>
      <div id="servicos"></div>
    </section>

    <section class="card">
      <h2><span class="n">4</span>Seus dados</h2>
      <label>Nome<input id="nome" autocomplete="name" maxlength="60" placeholder="Como podemos te chamar?"></label>
      <label>Telefone<input id="telefone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="15" placeholder="(81) 90000-0000"></label>
    </section>
  </div>

  <aside class="card" id="resumo-box">
    <h2>Resumo</h2>
    <dl id="resumo"></dl>
    <div id="msg" role="alert"></div>
    <button class="primary" id="confirmar">Confirmar agendamento</button>
  </aside>
</main>

<footer class="rodape">Atendimento de segunda a sábado, das 9h às 18h</footer>

<div class="barra" id="barra">
  <div class="barra-total"><small>Total</small><b id="barra-total">R$ 0,00</b></div>
  <button type="button" class="primary" data-acao="rolar">Revisar e confirmar</button>
</div>

<script src="app.js"></script>
</body>
</html>
